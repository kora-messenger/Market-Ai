name: Build Market Ai APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketAi-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run install-and-launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-none -no-snapshot -no-snapshot-save -accel on
          disable-animations: false
          emulator-boot-timeout: 900
          script: |
            set -x
            adb devices
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            # Clear logcat, then launch the app
            adb logcat -c
            adb shell am start -W -n com.veltravia.marketai/.MainActivity
            sleep 15

            # Save diagnostics FIRST — before any exit decision
            adb logcat -d > "$GITHUB_WORKSPACE/diag-logcat.txt"
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/diag-screenshot.png"

            # Is the process still alive?
            if adb shell pidof com.veltravia.marketai; then
              echo "APP IS RUNNING - no launch crash"
            else
              echo "APP CRASHED ON LAUNCH - see diag-logcat.txt"
              exit 1
            fi

      - name: Always upload smoke-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-diagnostics
          path: |
            diag-logcat.txt
            diag-screenshot.png
          retention-days: 30
          if-no-files-found: ignore
